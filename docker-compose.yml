

services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
      MYSQL_DATABASE: mangasvn
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the environment}
    ports:
      # Chi mo port tren localhost (DBeaver ket noi qua SSH Tunnel an toan, khong lo ra Internet)
      - "127.0.0.1:3306:3306"
    volumes:
        - ./init:/docker-entrypoint-initdb.d
        - mysql-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD" ]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: mangasvn-app
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/mangasvn
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the environment}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in the environment}
      CLOUDFLARE_ACCESS_KEY: ${CLOUDFLARE_ACCESS_KEY:?Set CLOUDFLARE_ACCESS_KEY in the environment}
      CLOUDFLARE_SECRET_KEY: ${CLOUDFLARE_SECRET_KEY:?Set CLOUDFLARE_SECRET_KEY in the environment}
      CLOUDFLARE_BUCKET_NAME: ${CLOUDFLARE_BUCKET_NAME:-comics}
      CLOUDFLARE_UPLOAD_ENDPOINT: ${CLOUDFLARE_UPLOAD_ENDPOINT:?Set CLOUDFLARE_UPLOAD_ENDPOINT in the environment}
      CLOUDFLARE_PUBLIC_URL: ${CLOUDFLARE_PUBLIC_URL:?Set CLOUDFLARE_PUBLIC_URL in the environment}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-50MB}
      MAX_REQUEST_SIZE: ${MAX_REQUEST_SIZE:-60MB}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://mangasvn.click,https://www.mangasvn.click,https://mangasvn.onrender.com,http://localhost:8080}
    networks:
      - default

volumes:
  mysql-data:
