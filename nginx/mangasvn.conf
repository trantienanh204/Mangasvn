# =============================================
# Nginx reverse proxy config cho MangaSVN
# File này đặt ở: /etc/nginx/sites-available/mangasvn
# Sau đó: ln -s /etc/nginx/sites-available/mangasvn /etc/nginx/sites-enabled/
# =============================================

# Chuyển HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name mangasvn.click www.mangasvn.click;

    # Chỉ cho phép Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect tất cả traffic còn lại sang HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mangasvn.click www.mangasvn.click;

    # === SSL/TLS (Let's Encrypt) ===
    # Chạy: certbot --nginx -d mangasvn.click -d www.mangasvn.click
    ssl_certificate     /etc/letsencrypt/live/mangasvn.click/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mangasvn.click/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # === Security Headers ===
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options           "SAMEORIGIN"                                   always;
    add_header X-Content-Type-Options    "nosniff"                                      always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
    add_header X-XSS-Protection          "1; mode=block"                                always;

    # === Rate limiting cho login (thêm lớp bảo vệ ngoài app) ===
    # Định nghĩa zone ở http block trong nginx.conf:
    #   limit_req_zone $binary_remote_addr zone=login_zone:10m rate=10r/m;
    location /api/auth/login {
        limit_req zone=login_zone burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # === Proxy tất cả request sang Spring Boot ===
    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Giới hạn kích thước request (upload ảnh/zip)
        client_max_body_size 110M;
    }
}
