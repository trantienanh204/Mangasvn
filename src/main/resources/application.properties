spring.application.name=demo
spring.config.import=optional:file:.env[.properties]
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/mangasvn}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQL_ROOT_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver



spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
jwt.secret=${JWT_SECRET_KEY}


cloudflare.r2.access-key=${CLOUDFLARE_ACCESS_KEY}
cloudflare.r2.secret-key=${CLOUDFLARE_SECRET_KEY}
cloudflare.r2.bucket-name=${CLOUDFLARE_BUCKET_NAME:comics}

cloudflare.r2.upload-endpoint=${CLOUDFLARE_UPLOAD_ENDPOINT}
cloudflare.r2.public-url=${CLOUDFLARE_PUBLIC_URL}


spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:20MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:25MB}
spring.jackson.serialization.fail-on-empty-beans=false


server.address=0.0.0.0
server.port=8080


