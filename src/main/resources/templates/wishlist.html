                <li class="nav-item dropdown">

                    </a>
                    <div class="dropdown-menu p-3 genres-menu" aria-labelledby="navbarDropdown" id="genres-menu">
                        <ul class="genres-list" id="genres-list">

                    </div>
                </li>
                <li class="nav-item">
                    <a class="nav-link active fw-bold text-primary" href="/view/favourite">YÊU THÍCH</a>
