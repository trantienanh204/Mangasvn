<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đọc Truyện - MangaSVN</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 & FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css" />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <!-- Site Styles -->
    <link rel="stylesheet" href="/css/CSStrangChu.css">
    <link rel="stylesheet" href="/css/CSSread.css?v=20260924-3">
    <link rel="stylesheet" href="/css/CSSGenneNavbar.css">
</head>
<body>
<!-- Navbar -->
<nav class="navbar navbar-expand-md navbar-dark bg-dark fixed-top shadow-sm border-bottom border-secondary">
    <div class="container-fluid px-3 px-lg-4">
        <a class="navbar-brand fw-bold text-primary fs-4" href="/">MANGASVN</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" href="/">TRANG CHỦ</a>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="/theloai" id="navbarDropdown" role="button"
                       data-bs-toggle="dropdown" aria-expanded="false">
                        THỂ LOẠI
                    </a>
                    <div class="dropdown-menu p-3 genres-menu" aria-labelledby="navbarDropdown" id="genres-menu">
                        <ul class="genres-list" id="genres-list">
                        </ul>
                    </div>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/view/favourite">YÊU THÍCH</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/view/history">LỊCH SỬ</a>
                </li>
            </ul>
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center">
                <li class="nav-item">
                    <span class="nav-link text-light fw-semibold" id="user-info"></span>
                </li>
                <li class="nav-item">
                    <a class="btn btn-outline-danger btn-sm ms-2" id="logout-link" href="#" style="display: none;" onclick="logout()"><i class="fa-solid fa-right-from-bracket me-1"></i>Đăng xuất</a>
                </li>
                <li class="nav-item">
                    <a class="btn btn-outline-primary btn-sm ms-2" id="login-link" href="/api/auth/login" style="display: none;">Đăng nhập</a>
                </li>
            </ul>
            <form class="d-flex ms-lg-3 mt-2 mt-lg-0" style="position: relative;" id="search-form">
                <input class="form-control form-control-sm me-2 bg-dark text-white border-secondary" type="search" id="search-input" placeholder="Tìm truyện..." aria-label="Search">
                <button class="btn btn-sm btn-primary" type="submit" id="search-button"><i class="fa-solid fa-magnifying-glass"></i></button>
                <div id="search-suggestions"></div>
            </form>
        </div>
    </div>
</nav>

<div class="container-xl content" style="margin-top: 85px;">
    <div class="comic-info">
        <div class="cover-image">
            <img id="comic-cover" src="" alt="Bìa truyện">
        </div>
        <div class="details">
            <h2 id="comic-title" class="fw-bold mb-3"></h2>
            <p><strong>Mô tả:</strong> <span id="comic-description"></span></p>
            <p><strong>Lượt thích:</strong> <span id="comic-likes"></span></p>
            <p><strong>Lượt xem:</strong> <span id="comic-views"></span></p>
            <p><strong>Ghi chú:</strong> <span id="comic-note"></span></p>
            <p><strong>Người dịch:</strong> <span id="comic-translator"></span></p>
            <p><strong>Tác giả:</strong> <span id="comic-authors">Chưa cập nhật</span></p>
            <p><strong>Danh mục:</strong> <span id="comic-categories">Chưa cập nhật</span></p>
            <div id="favorite-button-container" class="mt-2"></div>
        </div>
    </div>

    <div class="chapter-section mt-4">
        <h4 class="fw-bold mb-3"><i class="fa-solid fa-list me-2 text-primary"></i>Danh sách Chapter</h4>
        <div class="chapter-controls">
            <div class="chapter-list" id="chapter-list"></div>
        </div>
    </div>

    <div class="image-section mt-4" id="image-section">
        <h4 id="chapter-title" class="fw-bold mb-3"></h4>
        <button id="toggle-reading-mode" class="btn btn-success mb-3"><i class="fa-solid fa-book-open-reader me-1"></i> Chế độ đọc sách</button>
        <div class="image-container" id="chapter-images"></div>
        <div class="d-flex gap-2 my-3">
            <button id="load-all" class="btn btn-outline-primary btn-sm">Hiển thị tất cả</button>
            <button id="load-15" class="btn btn-outline-secondary btn-sm">Hiển thị 15 trang nữa</button>
        </div>
    </div>

    <div class="chat mt-5 p-3 rounded" style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1);">
        <h4 class="fw-bold mb-3"><i class="fa-solid fa-comments me-2 text-primary"></i>Bình luận</h4>
        <div id="comment-list" class="mb-3" style="max-height: 400px; overflow-y: auto;">
        </div>
        <div class="input-group">
            <input type="text" id="comment-input" class="form-control" placeholder="Nhập bình luận của bạn...">
            <button class="btn btn-primary" id="btn-submit-comment"><i class="fa-solid fa-paper-plane me-1"></i> Gửi</button>
        </div>
    </div>
</div>

<!-- Chế độ đọc sách -->
<div class="reading-mode" id="reading-mode">
    <div id="reading-progress-container">
        <div id="reading-progress-bar"></div>
    </div>
    <button class="close-btn" id="close-reading-mode">×</button>
    <img class="reading-image" id="reading-image" src="" alt="Trang truyện">
    <div class="pagination" id="pagination"></div>
</div>
<!-- Nút Lên đầu trang -->
<button id="back-to-top" title="Lên đầu trang">↑</button>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
<script src="/js/JStrangChu.js"></script>
<script src="/js/JSSearch.js"></script>
<script src="/js/JSread.js"></script>
<script src="/js/JSGenneNavbar.js"></script>
</body>
</html>
