<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - MangaSVN</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/CSSlogin.css?v=20261109-3">
</head>
<body>
<div class="login-container">
    <div class="logo">
        <i class="fa-solid fa-book-journal-whills" style="font-size: 2.2rem; color: #06b6d4;"></i>
    </div>

    <h1>MANGASVN</h1>
    <span id="error"></span>
    <form id="login-form">
        <div class="input-group">
            <label for="username"><i class="fa-solid fa-user me-1 text-info"></i> Tên đăng nhập</label>
            <input type="text" id="username" placeholder="Nhập tên đăng nhập của bạn" required>
        </div>

        <div class="input-group">
            <label for="password"><i class="fa-solid fa-lock me-1 text-info"></i> Mật khẩu</label>
            <input type="password" id="password" placeholder="Nhập mật khẩu của bạn" required>
        </div>

        <div class="remember-forgot">
            <div class="remember-me">
                <input type="checkbox" id="remember">
                <label for="remember">Ghi nhớ</label>
            </div>
            <div class="forgot-password">
                <a href="#">Quên mật khẩu?</a>
            </div>
        </div>

        <button type="submit" class="login-button">ĐĂNG NHẬP <i class="fa-solid fa-arrow-right ms-1"></i></button>

        <div class="signup-link">
            Chưa có tài khoản? <a href="/api/auth/register">Đăng ký ngay</a>
        </div>
    </form>
</div>
<script src="/js/JSlogin.js?v=20261109-3"></script>
</body>
</html>
